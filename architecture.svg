<svg viewBox="0 0 1200 640" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>Azure OpenAI RAG Document Assistant - Architecture</title>
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="aCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#00f0ff"/></marker>
    <marker id="aPink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ff2bd6"/></marker>
    <marker id="aGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#39ff14"/></marker>
    <marker id="aYellow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#fff200"/></marker>
    <style>
      .t { fill:#ffffff; font-size:15px; font-weight:700; text-anchor:middle; }
      .s { fill:#9aa4b2; font-size:11.5px; text-anchor:middle; }
      .lane { font-size:13px; font-weight:700; letter-spacing:3px; }
      .flow { stroke-dasharray:7 7; fill:none; stroke-width:2.2; animation: dash 1.1s linear infinite; }
      @keyframes dash { to { stroke-dashoffset:-14; } }
      .box { fill:#05060d; stroke-width:2.2; filter:url(#glow); animation: pulse 3s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { stroke-opacity:1; } 50% { stroke-opacity:.45; } }
    </style>
  </defs>

  <rect width="1200" height="640" fill="#000"/>
  <!-- subtle grid -->
  <g stroke="#0b1020" stroke-width="1">
    <path d="M0 80H1200M0 160H1200M0 240H1200M0 320H1200M0 400H1200M0 480H1200M0 560H1200"/>
    <path d="M80 0V640M160 0V640M240 0V640M320 0V640M400 0V640M480 0V640M560 0V640M640 0V640M720 0V640M800 0V640M880 0V640M960 0V640M1040 0V640M1120 0V640"/>
  </g>

  <text x="600" y="38" text-anchor="middle" fill="#fff" font-size="22" font-weight="800" filter="url(#glow)">AZURE OPENAI RAG DOCUMENT ASSISTANT</text>

  <!-- ===== Ingestion lane ===== -->
  <text x="40" y="92" class="lane" fill="#00f0ff" filter="url(#glow)">INGESTION PIPELINE</text>

  <rect class="box" x="40"  y="130" width="170" height="70" rx="10" stroke="#00f0ff"/>
  <text class="t" x="125" y="160">PDF Upload</text><text class="s" x="125" y="180">Streamlit UI</text>

  <rect class="box" x="270" y="130" width="170" height="70" rx="10" stroke="#00f0ff" style="animation-delay:.4s"/>
  <text class="t" x="355" y="160">PyMuPDF</text><text class="s" x="355" y="180">page-aware extraction</text>

  <rect class="box" x="500" y="130" width="170" height="70" rx="10" stroke="#00f0ff" style="animation-delay:.8s"/>
  <text class="t" x="585" y="160">Recursive Splitter</text><text class="s" x="585" y="180">size + overlap</text>

  <rect class="box" x="730" y="130" width="170" height="70" rx="10" stroke="#b44dff" style="animation-delay:1.2s"/>
  <text class="t" x="815" y="160">Azure Embeddings</text><text class="s" x="815" y="180">text to vectors</text>

  <rect class="box" x="960" y="130" width="170" height="70" rx="10" stroke="#39ff14" style="animation-delay:1.6s"/>
  <text class="t" x="1045" y="160">ChromaDB</text><text class="s" x="1045" y="180">local vector store</text>

  <path class="flow" d="M210,165 H268"  stroke="#00f0ff" marker-end="url(#aCyan)"/>
  <path class="flow" d="M440,165 H498"  stroke="#00f0ff" marker-end="url(#aCyan)"/>
  <path class="flow" d="M670,165 H728"  stroke="#00f0ff" marker-end="url(#aCyan)"/>
  <path class="flow" d="M900,165 H958"  stroke="#00f0ff" marker-end="url(#aCyan)"/>

  <!-- ===== Query lane ===== -->
  <text x="40" y="362" class="lane" fill="#ff2bd6" filter="url(#glow)">QUERY PIPELINE</text>

  <rect class="box" x="40"  y="400" width="170" height="70" rx="10" stroke="#ff2bd6"/>
  <text class="t" x="125" y="430">User Question</text><text class="s" x="125" y="450">normalized</text>

  <rect class="box" x="270" y="400" width="170" height="70" rx="10" stroke="#fff200" style="animation-delay:.4s"/>
  <text class="t" x="355" y="430">LRU Cache</text><text class="s" x="355" y="450">collection + question key</text>

  <rect class="box" x="500" y="400" width="170" height="70" rx="10" stroke="#39ff14" style="animation-delay:.8s"/>
  <text class="t" x="585" y="430">Similarity Search</text><text class="s" x="585" y="450">top-k chunks</text>

  <rect class="box" x="730" y="400" width="170" height="70" rx="10" stroke="#b44dff" style="animation-delay:1.2s"/>
  <text class="t" x="815" y="430">Azure OpenAI Chat</text><text class="s" x="815" y="450">grounded prompt</text>

  <rect class="box" x="960" y="400" width="170" height="70" rx="10" stroke="#ff8a00" style="animation-delay:1.6s"/>
  <text class="t" x="1045" y="430">Answer + Sources</text><text class="s" x="1045" y="450">file name + page</text>

  <path class="flow" d="M210,435 H268" stroke="#ff2bd6" marker-end="url(#aPink)"/>
  <path class="flow" d="M440,435 H498" stroke="#ff2bd6" marker-end="url(#aPink)"/>
  <path class="flow" d="M670,435 H728" stroke="#ff2bd6" marker-end="url(#aPink)"/>
  <path class="flow" d="M900,435 H958" stroke="#ff2bd6" marker-end="url(#aPink)"/>

  <!-- ChromaDB -> Similarity Search (retrieval link) -->
  <path class="flow" d="M1045,200 V290 H585 V398" stroke="#39ff14" marker-end="url(#aGreen)"/>
  <text x="815" y="282" class="s" fill="#39ff14" style="fill:#39ff14">retrieve nearest vectors</text>

  <!-- Query embedding link -->
  <path class="flow" d="M815,200 V318 H700 H585" stroke="#b44dff" style="animation-duration:1.6s"/>
  <text x="823" y="338" class="s" style="fill:#b44dff;text-anchor:start">query embedding</text>

  <!-- Cache hit bypass -->
  <path class="flow" d="M355,470 C355,570 1045,570 1045,472" stroke="#fff200" marker-end="url(#aYellow)"/>
  <text x="700" y="575" class="s" style="fill:#fff200">cache hit: skip retrieval + generation</text>

  <!-- footer legend -->
  <g font-size="11.5" fill="#9aa4b2">
    <circle cx="40" cy="618" r="5" fill="#00f0ff"/><text x="52" y="622">ingest</text>
    <circle cx="110" cy="618" r="5" fill="#ff2bd6"/><text x="122" y="622">query</text>
    <circle cx="180" cy="618" r="5" fill="#39ff14"/><text x="192" y="622">retrieval</text>
    <circle cx="262" cy="618" r="5" fill="#b44dff"/><text x="274" y="622">Azure OpenAI</text>
    <circle cx="370" cy="618" r="5" fill="#fff200"/><text x="382" y="622">cache</text>
  </g>
</svg>
